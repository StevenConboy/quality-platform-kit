[project]
name = "quality-platform-kit"
version = "0.1.0"
description = "Demo of shared SDET infrastructure: test framework, AI resilience harness, CI, and AI-assisted test authoring."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests", "harness"]
# --strict-markers: a marker that is not registered below is an error, not a silent no-op.
# --strict-config: a typo in this section is an error too.
addopts = "--strict-markers --strict-config -ra"
log_level = "INFO"
filterwarnings = [
    # Starlette's TestClient uses a deprecated anyio alias. Not our code; remove this line
    # once a Starlette release stops triggering it.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "smoke: fast checks that the service is up and the main paths work; run on every push",
    "regression: behaviour that has been specified or has broken before; run before merge",
    "adversarial: hostile or malformed input; the app must stay safe, not necessarily useful",
    "flaky: quarantined; runs but does not block the pipeline (see scripts/flake_detect.py)",
    "slow: takes more than a couple of seconds; skipped with -m 'not slow'",
]
